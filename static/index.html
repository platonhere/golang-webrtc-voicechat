<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceChat Conference</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #151520;
      --bg-tertiary: #1e1e2e;
      --bg-hover: #252538;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --success: #10b981;
      --error: #ef4444;
      --border: #27272a;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 400;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px var(--shadow);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 16px var(--shadow);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-hover);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    button {
      padding: 0.875rem 1.5rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    .btn-danger {
      background: var(--error);
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 1rem;
    }

    .status-badge.success {
      color: var(--success);
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    #tokenDisplay {
      font-weight: 500;
    }

    #log {
      white-space: pre-wrap;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    #log::-webkit-scrollbar {
      width: 8px;
    }

    #log::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    #log::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    #log::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .media-status {
      margin-top: 1rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .video-tile {
      position: relative;
      overflow: hidden;
      min-height: 180px;
      aspect-ratio: 16 / 9;
      background: #050509;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .video-tile video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #050509;
    }

    .video-tile.local video {
      transform: scaleX(-1);
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      font-size: 0.95rem;
    }

    .video-tile.has-video .video-placeholder {
      display: none;
    }

    .video-tile.audio-only video {
      opacity: 0;
    }

    .video-label,
    .video-state {
      position: absolute;
      z-index: 1;
      left: 0.75rem;
      right: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .video-label {
      bottom: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .video-state {
      top: 0.75rem;
      justify-content: flex-start;
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .empty-state {
      margin-top: 1rem;
      padding: 0.875rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .empty-state[hidden] {
      display: none;
    }

    .auth-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .auth-section {
        grid-template-columns: 1fr;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 1.5rem;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>VoiceChat Conference</h1>
      <p class="subtitle">Голосовые и видеоконференции на WebRTC</p>
    </header>

    <div class="card fade-in">
      <div class="card-title">Авторизация</div>
      <div class="auth-section">
        <div>
          <div class="form-group">
            <label>Имя пользователя</label>
            <input id="regUser" type="text" placeholder="Введите имя пользователя">
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input id="regPass" type="password" placeholder="Введите пароль">
          </div>
          <button id="regBtn">Зарегистрироваться</button>
        </div>
        <div>
          <div class="form-group">
            <label>Имя пользователя</label>
            <input id="loginUser" type="text" placeholder="Введите имя пользователя">
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input id="loginPass" type="password" placeholder="Введите пароль">
          </div>
          <button id="loginBtn">Войти</button>
        </div>
      </div>
      <div id="tokenDisplay" class="status-badge"></div>
    </div>

    <div class="card fade-in">
      <div class="card-title">Подключение</div>
      <div class="form-group">
        <label>Комната</label>
        <input id="room" type="text" value="room1" placeholder="Название комнаты">
      </div>
      <div class="btn-group">
        <button id="connectBtn">Подключиться</button>
        <button id="leaveBtn" class="btn-danger" disabled>Покинуть</button>
        <button id="micBtn" class="btn-secondary" disabled>Микрофон</button>
        <button id="cameraBtn" class="btn-secondary" disabled>Камера</button>
        <button id="statsBtn" class="btn-secondary" disabled>Статистика</button>
      </div>
      <div id="mediaStatus" class="status-badge media-status">Камера и микрофон не подключены</div>
    </div>

    <div class="card fade-in">
      <div class="card-title">Конференция</div>
      <div id="videoGrid" class="video-grid">
        <div id="localTile" class="video-tile local">
          <video id="localVideo" autoplay muted playsinline></video>
          <div id="localPlaceholder" class="video-placeholder">Камера не подключена</div>
          <div class="video-state">Вы</div>
          <div class="video-label">Вы</div>
        </div>
      </div>
      <div id="remoteEmpty" class="empty-state">Ожидаем других участников</div>
    </div>

    <div class="card fade-in">
      <div class="card-title">Лог событий</div>
      <div id="log"></div>
    </div>

  </div>

<script>
const logEl = document.getElementById('log')
const tokenDisplay = document.getElementById('tokenDisplay')
const mediaStatus = document.getElementById('mediaStatus')
const connectBtn = document.getElementById('connectBtn')
const leaveBtn = document.getElementById('leaveBtn')
const statsBtn = document.getElementById('statsBtn')
const micBtn = document.getElementById('micBtn')
const cameraBtn = document.getElementById('cameraBtn')
const videoGrid = document.getElementById('videoGrid')
const remoteEmpty = document.getElementById('remoteEmpty')
const localTile = document.getElementById('localTile')
const localVideo = document.getElementById('localVideo')
const localPlaceholder = document.getElementById('localPlaceholder')

function log(s) { 
  const timestamp = new Date().toLocaleTimeString('ru-RU');
  logEl.textContent += `[${timestamp}] ${s}\n`; 
  logEl.scrollTop = logEl.scrollHeight;
}

function updateBadge(el, text, isSuccess = false) {
  el.textContent = text;
  if (isSuccess) {
    el.classList.add('success');
  } else {
    el.classList.remove('success');
  }
}

function updateTokenDisplay(text, isSuccess = false) {
  updateBadge(tokenDisplay, text, isSuccess);
}

function updateMediaStatus(text, isSuccess = false) {
  updateBadge(mediaStatus, text, isSuccess);
}

let pc = null;
let ws = null;
let localStream = null;
let statsInterval = null;
const remoteTiles = new Map();
const pendingRemoteCandidates = [];

function getLiveTrack(kind) {
  if (!localStream) return null;
  return localStream.getTracks().find(t => t.kind === kind && t.readyState === 'live') || null;
}

function updateLocalTile() {
  const videoTrack = getLiveTrack('video');
  const hasVideo = Boolean(videoTrack && videoTrack.enabled);
  localTile.classList.toggle('has-video', hasVideo);
  localTile.classList.toggle('audio-only', Boolean(localStream && !hasVideo));
  localPlaceholder.textContent = localStream ? 'Видео выключено' : 'Камера не подключена';
}

function updateMediaButtons() {
  const audioTrack = getLiveTrack('audio');
  const videoTrack = getLiveTrack('video');

  micBtn.disabled = !audioTrack;
  cameraBtn.disabled = !videoTrack;
  micBtn.textContent = audioTrack ? (audioTrack.enabled ? 'Микрофон вкл' : 'Микрофон выкл') : 'Микрофон';
  cameraBtn.textContent = videoTrack ? (videoTrack.enabled ? 'Камера вкл' : 'Камера выкл') : 'Камера';
  updateLocalTile();
}

function stopStats() {
  if (!statsInterval) return;
  clearInterval(statsInterval);
  statsInterval = null;
  statsBtn.textContent = 'Статистика';
}

function updateRemoteEmpty() {
  remoteEmpty.hidden = remoteTiles.size > 0;
}

function clearRemoteTiles() {
  remoteTiles.forEach(({ tile, video }) => {
    video.srcObject = null;
    tile.remove();
  });
  remoteTiles.clear();
  updateRemoteEmpty();
}

function createRemoteTile(key) {
  const tile = document.createElement('div');
  tile.className = 'video-tile';
  tile.dataset.streamId = key;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;

  const placeholder = document.createElement('div');
  placeholder.className = 'video-placeholder';
  placeholder.textContent = 'Поток подключается';

  const state = document.createElement('div');
  state.className = 'video-state';
  state.textContent = 'Медиа';

  const label = document.createElement('div');
  label.className = 'video-label';
  label.textContent = 'Участник';

  tile.append(video, placeholder, state, label);
  videoGrid.appendChild(tile);

  return { tile, video, placeholder, state, label, stream: null };
}

function updateRemoteTile(item) {
  const stream = item.stream;
  const hasVideo = Boolean(stream && stream.getVideoTracks().some(t => t.readyState !== 'ended'));
  const hasAudio = Boolean(stream && stream.getAudioTracks().some(t => t.readyState !== 'ended'));

  item.tile.classList.toggle('has-video', hasVideo);
  item.tile.classList.toggle('audio-only', !hasVideo);
  item.placeholder.textContent = hasAudio ? 'Участник без видео' : 'Поток подключается';
  item.state.textContent = hasVideo ? 'Видео' : 'Аудио';
}

function attachRemoteTrack(stream, track) {
  const mediaStream = stream || new MediaStream([track]);
  if (!mediaStream.getTracks().some(t => t.id === track.id)) {
    mediaStream.addTrack(track);
  }

  const key = mediaStream.id || track.id;
  let item = remoteTiles.get(key);
  if (!item) {
    item = createRemoteTile(key);
    remoteTiles.set(key, item);
  }

  item.stream = mediaStream;
  if (item.video.srcObject !== mediaStream) {
    item.video.srcObject = mediaStream;
    item.video.play().catch(() => {});
  }

  track.onunmute = () => updateRemoteTile(item);
  track.onended = () => {
    updateRemoteTile(item);
    if (mediaStream.getTracks().every(t => t.readyState === 'ended')) {
      item.video.srcObject = null;
      item.tile.remove();
      remoteTiles.delete(key);
      updateRemoteEmpty();
    }
  };

  updateRemoteTile(item);
  updateRemoteEmpty();
}

async function getConferenceMedia() {
  const audio = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true
  };
  const video = {
    width: { ideal: 1280 },
    height: { ideal: 720 },
    frameRate: { ideal: 30, max: 30 }
  };

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio, video });
    log('Доступ к камере и микрофону получен');
    updateMediaStatus('Камера и микрофон активны', true);
    return stream;
  } catch (videoError) {
    log('Камера недоступна, пробуем подключить только микрофон: ' + videoError.message);
    const stream = await navigator.mediaDevices.getUserMedia({ audio, video: false });
    log('Доступ к микрофону получен');
    updateMediaStatus('Подключен только микрофон', true);
    return stream;
  }
}

function attachLocalStream(stream) {
  localVideo.srcObject = stream;
  localVideo.play().catch(() => {});
  updateMediaButtons();
}

function sendSignal(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
  }
}

async function flushPendingRemoteCandidates() {
  if (!pc || !pc.remoteDescription) return;

  while (pendingRemoteCandidates.length > 0) {
    const candidate = pendingRemoteCandidates.shift();
    try {
      await pc.addIceCandidate(candidate);
      log('ICE кандидат добавлен');
    } catch (e) {
      log('Ошибка ICE кандидата: ' + e.message);
    }
  }
}

async function handleSignalMessage(ev) {
  const msg = JSON.parse(ev.data);
  log(`Сообщение: ${msg.type}`);
  if (!pc) return;

  if (msg.type === 'answer') {
    const desc = { type: 'answer', sdp: msg.sdp };
    await pc.setRemoteDescription(desc);
    log('Удаленное описание установлено (answer)');
    await flushPendingRemoteCandidates();
  } else if (msg.type === 'offer') {
    const offer = { type: 'offer', sdp: msg.sdp };
    await pc.setRemoteDescription(offer);
    await flushPendingRemoteCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal({ type: 'answer', sdp: answer.sdp, sdpType: 'answer' });
    log('Ответ на предложение сервера отправлен');
  } else if (msg.type === 'candidateFromServer' || msg.type === 'candidate') {
    if (msg.candidate) {
      if (!pc.remoteDescription) {
        pendingRemoteCandidates.push(msg.candidate);
        log('ICE кандидат поставлен в очередь');
      } else {
        try {
          await pc.addIceCandidate(msg.candidate);
          log('ICE кандидат добавлен');
        } catch(e) {
          log('Ошибка ICE кандидата: ' + e.message);
        }
      }
    }
  }
}

function createPeerConnection() {
  const connection = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });

  connection.ontrack = (ev) => {
    const stream = ev.streams[0] || new MediaStream([ev.track]);
    attachRemoteTrack(stream, ev.track);
    log(`Получен ${ev.track.kind === 'video' ? 'видео' : 'аудио'} поток`);
  };

  connection.onicecandidate = (e) => {
    if (!e.candidate) return;
    sendSignal({ type: 'candidate', candidate: e.candidate });
  };

  connection.onconnectionstatechange = () => {
    log(`WebRTC состояние: ${connection.connectionState}`);
  };

  connection.oniceconnectionstatechange = () => {
    log(`ICE состояние: ${connection.iceConnectionState}`);
  };

  connection.onsignalingstatechange = () => {
    log(`Signaling состояние: ${connection.signalingState}`);
  };

  return connection;
}

function resetCallState(sendLeave = false) {
  stopStats();
  pendingRemoteCandidates.length = 0;

  const currentWs = ws;
  ws = null;
  if (sendLeave && currentWs && currentWs.readyState === WebSocket.OPEN) {
    currentWs.send(JSON.stringify({ type: 'leave' }));
  }
  if (currentWs && currentWs.readyState !== WebSocket.CLOSED && currentWs.readyState !== WebSocket.CLOSING) {
    currentWs.close();
  }

  if (pc) {
    try {
      pc.getSenders().forEach(sender => {
        if (sender.track) pc.removeTrack(sender);
      });
    } catch(e) {
      console.warn(e);
    }
    pc.close();
    pc = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  localVideo.srcObject = null;
  clearRemoteTiles();
  updateMediaButtons();
  updateMediaStatus('Камера и микрофон не подключены', false);
  connectBtn.disabled = false;
  leaveBtn.disabled = true;
  statsBtn.disabled = true;
}

connectBtn.onclick = async () => {
  const token = sessionStorage.getItem('vc_token');
  if (!token) {
    log('Ошибка: необходимо сначала войти в систему');
    return;
  }

  const room = document.getElementById('room').value || 'room1';
  connectBtn.disabled = true;

  try {
    localStream = await getConferenceMedia();
    attachLocalStream(localStream);

    pc = createPeerConnection();
    for (const track of localStream.getTracks()) {
      pc.addTrack(track, localStream);
    }

    const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(protocol + location.host + '/ws');

    ws.onopen = async () => {
      try {
        log('WebSocket подключен');
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal({ type: 'join', room, sdp: offer.sdp, sdpType: 'offer', token });
        log(`Отправлен запрос на подключение к комнате "${room}"`);

        leaveBtn.disabled = false;
        statsBtn.disabled = false;
        updateMediaButtons();
      } catch(e) {
        log('Ошибка WebRTC offer: ' + e.message);
        resetCallState(false);
      }
    };

    ws.onmessage = (ev) => {
      handleSignalMessage(ev).catch(e => log('Ошибка сигналинга: ' + e.message));
    };

    ws.onclose = (event) => {
      log(`WebSocket закрыт (code=${event.code})`);
      resetCallState(false);
    };

    ws.onerror = () => {
      log('Ошибка WebSocket');
    };
  } catch(e) {
    log('Ошибка подключения: ' + e.message);
    resetCallState(false);
  }
};

document.getElementById('regBtn').onclick = async () => {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  
  if (!username || !password) {
    log('Заполните все поля');
    return;
  }
  
  try {
    const res = await fetch('/api/register', { 
      method: 'POST', 
      body: JSON.stringify({ username, password }), 
      headers: { 'Content-Type':'application/json' } 
    });
    
    if (res.status === 201) {
      log('Регистрация успешна');
      document.getElementById('regUser').value = '';
      document.getElementById('regPass').value = '';
    } else {
      const text = await res.text();
      log('Ошибка регистрации: ' + (text || 'неизвестная ошибка'));
    }
  } catch(e) { 
    log('Ошибка регистрации: ' + e.message);
  }
};

document.getElementById('loginBtn').onclick = async () => {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  
  if (!username || !password) {
    log('Заполните все поля');
    return;
  }
  
  try {
    const res = await fetch('/api/login', { 
      method: 'POST', 
      body: JSON.stringify({ username, password }), 
      headers: { 'Content-Type':'application/json' } 
    });
    
    const j = await res.json();
    if (j.token) {
      sessionStorage.setItem('vc_token', j.token);
      updateTokenDisplay('Выполнен вход', true);
      log('Вход выполнен успешно');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    } else {
      updateTokenDisplay('Ошибка входа', false);
      log('Ошибка входа: неверные данные');
    }
  } catch(e) { 
    updateTokenDisplay('Ошибка входа', false);
    log('Ошибка входа: ' + e.message);
  }
};

leaveBtn.onclick = () => {
  resetCallState(true);
  log('Покинул комнату');
};

micBtn.onclick = () => {
  const track = getLiveTrack('audio');
  if (!track) return;
  track.enabled = !track.enabled;
  updateMediaButtons();
  log(track.enabled ? 'Микрофон включен' : 'Микрофон выключен');
};

cameraBtn.onclick = () => {
  const track = getLiveTrack('video');
  if (!track) return;
  track.enabled = !track.enabled;
  updateMediaButtons();
  log(track.enabled ? 'Камера включена' : 'Камера выключена');
};

statsBtn.onclick = () => {
  if (!pc) return;
  
  const show = async () => {
    try {
      const stats = await pc.getStats();
      let hasStats = false;
      stats.forEach(report => {
        if (report.type === 'outbound-rtp' || report.type === 'inbound-rtp') {
          hasStats = true;
          const direction = report.type === 'outbound-rtp' ? 'Исходящий' : 'Входящий';
          const mediaKind = report.kind || report.mediaType || 'media';
          const packets = report.packetsSent || report.packetsReceived || 0;
          const bytes = report.bytesSent || report.bytesReceived || 0;
          const jitter = report.jitter || 0;
          log(`${direction} ${mediaKind}: пакетов=${packets}, байт=${bytes}, джиттер=${jitter.toFixed(2)}`);
        }
      });
      if (!hasStats) {
        log('Статистика пока недоступна');
      }
    } catch(e) {
      log('Ошибка получения статистики: ' + e.message);
    }
  };
  
  show();
  
  if (!statsInterval) {
    statsInterval = setInterval(show, 3000);
    statsBtn.textContent = 'Остановить статистику';
    log('Статистика включена (обновление каждые 3 сек)');
  } else {
    stopStats();
    log('Статистика остановлена');
  }
};

window.addEventListener('DOMContentLoaded', () => {
  const token = sessionStorage.getItem('vc_token');
  if (token) {
    updateTokenDisplay('Токен найден (вход выполнен ранее)', true);
    log('Найден сохраненный токен');
  } else {
    updateTokenDisplay('Необходимо войти в систему', false);
  }
  updateRemoteEmpty();
  updateMediaButtons();
  log('Интерфейс загружен');
});
</script>
</body>
</html>
